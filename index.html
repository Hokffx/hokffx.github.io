<!DOCTYPE html>
<html>
<head>
  <title>Auxilio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;

      /* FULL PURPLE BACKGROUND */
      background: radial-gradient(circle at top, #2b0b4f, #0b0515 80%);
    }

    .container {
      width: 360px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: auto;
      border-radius: 24px;
      background: linear-gradient(135deg, #8a2be2, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 60px rgba(168,85,247,0.7);
      font-size: 34px;
    }

    h1 {
      margin: 12px 0 5px;
      font-size: 30px;
    }

    .sub {
      color: #bbb;
      font-size: 12px;
      letter-spacing: 4px;
    }

    .card {
      background: rgba(25,15,45,0.8);
      border-radius: 24px;
      padding: 18px;
      margin: 15px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      background: #2b1a4a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c084fc;
      font-size: 20px;
      box-shadow: inset 0 0 10px rgba(168,85,247,0.2);
    }

    .text small {
      color: #aaa;
      font-size: 12px;
    }

    /* 🔥 PREMIUM TOGGLE */
    .toggle {
      width: 60px;
      height: 32px;
      background: #2a2a3d;
      border-radius: 50px;
      position: relative;
      cursor: pointer;
      transition: 0.4s;
    }

    .toggle::before {
      content: "";
      width: 26px;
      height: 26px;
      position: absolute;
      top: 3px;
      left: 4px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffffff, #dcdcdc);
      box-shadow:
        0 4px 10px rgba(0,0,0,0.4),
        inset 0 2px 4px rgba(255,255,255,0.6);
      transition: 0.4s;
    }

    .toggle.active {
      background: linear-gradient(90deg, #7b2ff7, #c084fc);
      box-shadow:
        0 0 20px rgba(168,85,247,0.9),
        inset 0 0 10px rgba(255,255,255,0.2);
    }

    .toggle.active::before {
      left: 30px;
    }

    /* glow animation */
    .toggle.active {
      animation: glow 1.5s infinite alternate;
    }

    @keyframes glow {
      from {
        box-shadow: 0 0 10px #a855f7;
      }
      to {
        box-shadow: 0 0 25px #c084fc;
      }
    }

    .toggle:active::before {
      transform: scale(0.9);
    }

  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="logo">🎯</div>
    <h1>Auxilio</h1>
    <div class="sub">@HOKFFX</div>
  </div>

  <div class="card">
    <div class="left">
      <div class="icon">🎯</div>
      <div class="text">
        <div>Aimbot</div>
        <small>Auto-aim assist</small>
      </div>
    </div>
    <div class="toggle active" onclick="toggle(this)"></div>
  </div>

  <div class="card">
    <div class="left">
      <div class="icon">⚡</div>
      <div class="text">
        <div>Maintain Headshot</div>
        <small>Lock to head</small>
      </div>
    </div>
    <div class="toggle" onclick="toggle(this)"></div>
  </div>

  <div class="card">
    <div class="left">
      <div class="icon">📊</div>
      <div class="text">
        <div>120 FPS</div>
        <small>Max frame rate</small>
      </div>
    </div>
    <div class="toggle" onclick="toggle(this)"></div>
  </div>

  <div class="card">
    <div class="left">
      <div class="icon">📶</div>
      <div class="text">
        <div>Anti Lag</div>
        <small>Network optimizer</small>
      </div>
    </div>
    <div class="toggle" onclick="toggle(this)"></div>
  </div>

</div>

<script>
  function toggle(el) {
    el.classList.toggle("active");
  }
</script>

</body>
</html>
