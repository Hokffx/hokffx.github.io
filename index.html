<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auxilio - @Hokffx</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#07050f;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* KEY SCREEN */
.key-screen{
  width:100%;
  max-width:380px;
  text-align:center;
}

.logo{
  width:90px;
  margin-bottom:20px;
}

.key-input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  background:#141124;
  color:#aaa;
  margin-top:10px;
}

.key-btn{
  width:100%;
  margin-top:14px;
  padding:14px;
  border:none;
  border-radius:14px;
  background:linear-gradient(90deg,#7b3fe4,#a855f7);
  color:white;
  font-weight:600;
}

/* PANEL */
.panel{
  display:none;
  width:100%;
  max-width:380px;
}

.header{
  text-align:center;
  margin-bottom:20px;
}

.icon-box{
  width:80px;
  height:80px;
  margin:auto;
  border-radius:22px;
  background:linear-gradient(145deg,#7b3fe4,#a855f7);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 40px rgba(140,80,255,0.6);
}

.icon-box svg{
  width:36px;
  stroke:white;
}

h1{margin-top:10px;font-size:28px}
.subtitle{color:#aaa;letter-spacing:3px;font-size:12px}

/* CARDS */
.card{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#0f0c1d;
  border-radius:20px;
  padding:16px;
  margin-top:14px;
  border:1px solid rgba(255,255,255,0.05);
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.left{
  display:flex;
  gap:14px;
  align-items:center;
}

.icon{
  width:50px;
  height:50px;
  border-radius:14px;
  background:#1b1530;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon svg{
  width:22px;
  stroke:#a855f7;
}

.title{font-weight:600}
.sub{font-size:12px;color:#888}

/* SWITCH */
.switch{
  width:54px;
  height:30px;
  border-radius:20px;
  background:linear-gradient(90deg,#7b3fe4,#a855f7);
  position:relative;
  cursor:pointer;
  box-shadow:0 0 15px rgba(168,85,247,0.7);
}

.switch.off{
  background:#222;
  box-shadow:none;
}

.knob{
  position:absolute;
  width:24px;
  height:24px;
  border-radius:50%;
  background:white;
  top:3px;
  right:3px;
  transition:0.3s;
}

.switch.off .knob{
  left:3px;
  right:auto;
}
</style>
</head>

<body>

<!-- KEY SCREEN -->
<div class="key-screen" id="keyScreen">
  <img src="logo.png" class="logo">
  <h2>Enter Key</h2>

  <input type="text" id="keyInput" class="key-input" placeholder="Enter key...">
  <button class="key-btn" onclick="checkKey()">Unlock</button>
</div>

<!-- PANEL -->
<div class="panel" id="panel">

  <div class="header">
    <div class="icon-box">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8"/>
      </svg>
    </div>
    <h1>Auxilio</h1>
    <div class="subtitle">@HOKFFX</div>
  </div>

  <!-- CARD 1 -->
  <div class="card">
    <div class="left">
      <div class="icon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
      </div>
      <div>
        <div class="title">Aimbot</div>
        <div class="sub">Auto-aim assist</div>
      </div>
    </div>
    <div class="switch" onclick="tog(this)">
      <div class="knob"></div>
    </div>
  </div>

  <!-- CARD 2 -->
  <div class="card">
    <div class="left">
      <div class="icon">
        <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14"/></svg>
      </div>
      <div>
        <div class="title">Maintain Headshot</div>
        <div class="sub">Lock to head</div>
      </div>
    </div>
    <div class="switch" onclick="tog(this)">
      <div class="knob"></div>
    </div>
  </div>

  <!-- CARD 3 -->
  <div class="card">
    <div class="left">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M12 6v6l4 2"/></svg>
      </div>
      <div>
        <div class="title">120 FPS</div>
        <div class="sub">Max frame rate</div>
      </div>
    </div>
    <div class="switch" onclick="tog(this)">
      <div class="knob"></div>
    </div>
  </div>

  <!-- CARD 4 -->
  <div class="card">
    <div class="left">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M5 12a10 10 0 0 1 14 0"/></svg>
      </div>
      <div>
        <div class="title">Anti Lag</div>
        <div class="sub">Network optimizer</div>
      </div>
    </div>
    <div class="switch" onclick="tog(this)">
      <div class="knob"></div>
    </div>
  </div>

</div>

<script>
function checkKey(){
  let key=document.getElementById("keyInput").value;
  if(key==="Hokffx24266"){
    document.getElementById("keyScreen").style.display="none";
    document.getElementById("panel").style.display="block";
  } else {
    alert("Invalid Key");
  }
}

function tog(el){
  el.classList.toggle("off");
}
</script>

</body>
</html>
