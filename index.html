<!DOCTYPE html>
<html>
<head>
  <title>Auxilio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: #0b0b14;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 350px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: auto;
      border-radius: 20px;
      background: linear-gradient(135deg, #7b2ff7, #f107a3);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px #7b2ff7;
      font-size: 30px;
    }

    h1 {
      margin: 10px 0 5px;
    }

    .sub {
      color: #aaa;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .card {
      background: #141422;
      border-radius: 20px;
      padding: 15px;
      margin: 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon {
      width: 45px;
      height: 45px;
      border-radius: 12px;
      background: #1e1e2e;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b56dff;
      font-size: 18px;
    }

    .text small {
      color: #aaa;
      font-size: 12px;
    }

    .toggle {
      width: 50px;
      height: 26px;
      background: #333;
      border-radius: 20px;
      position: relative;
      cursor: pointer;
    }

    .toggle::before {
      content: "";
      width: 22px;
      height: 22px;
      background: white;
      position: absolute;
      top: 2px;
      left: 3px;
      border-radius: 50%;
      transition: 0.3s;
    }

    .toggle.active {
      background: linear-gradient(90deg, #7b2ff7, #f107a3);
      box-shadow: 0 0 10px #7b2ff7;
    }

    .toggle.active::before {
      left: 25px;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="logo">🎯</div>
    <h1>Auxilio</h1>
    <div class="sub">@HOKFFX</div>
  </div>

  <div class="card">
    <div class="left">
      <div class="icon">🎯</div>
      <div class="text">
        <div>Aimbot</div>
        <small>Auto-aim assist</small>
      </div>
    </div>
    <div class="toggle active" onclick="toggle(this)"></div>
  </div>

  <div class="card">
    <div class="left">
      <div class="icon">⚡</div>
      <div class="text">
        <div>Maintain Headshot</div>
        <small>Lock to head</small>
      </div>
    </div>
    <div class="toggle" onclick="toggle(this)"></div>
  </div>

  <div class="card">
    <div class="left">
      <div class="icon">📊</div>
      <div class="text">
        <div>120 FPS</div>
        <small>Max frame rate</small>
      </div>
    </div>
    <div class="toggle" onclick="toggle(this)"></div>
  </div>

  <div class="card">
    <div class="left">
      <div class="icon">📶</div>
      <div class="text">
        <div>Anti Lag</div>
        <small>Network optimizer</small>
      </div>
    </div>
    <div class="toggle" onclick="toggle(this)"></div>
  </div>

</div>

<script>
  function toggle(el) {
    el.classList.toggle("active");
  }
</script>

</body>
  </html>
