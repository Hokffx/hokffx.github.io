<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auxilio - @Hokffx</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#07050f;
  color:#eee;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

/* KEY SCREEN */
.key-screen{
  width:100%;
  max-width:380px;
  text-align:center;
}
.logo{width:90px;margin-bottom:20px;}

.key-input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  background:#141124;
  color:white;
}

.key-btn{
  width:100%;
  margin-top:14px;
  padding:14px;
  border:none;
  border-radius:14px;
  background:linear-gradient(90deg,#7b3fe4,#a855f7);
  color:white;
}

/* PANEL */
.panel{display:none;width:100%;max-width:380px;}
.header{text-align:center;margin-bottom:24px;}

.icon-box{
  width:64px;height:64px;margin:0 auto 12px;
  background:linear-gradient(145deg,#7b3fe4,#a855f7);
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 30px rgba(168,85,247,0.5);
}

h1{font-size:24px;}
.subtitle{font-size:11px;color:#aaa;letter-spacing:3px;}

/* CARDS */
.controls{display:flex;flex-direction:column;gap:14px;}

.toggle-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#0f0c1a;
  border-radius:18px;
  padding:16px;
  border:1px solid rgba(255,255,255,0.05);
}

.toggle-left{
  display:flex;
  align-items:center;
  gap:14px;
}

.toggle-icon{
  width:48px;height:48px;
  border-radius:14px;
  background:#161225;
  display:flex;align-items:center;justify-content:center;
}

.toggle-icon svg{
  width:20px;height:20px;
  stroke:#a855f7;
  stroke-width:2;
  fill:none;
}

.toggle-label{font-weight:600;}
.toggle-sub{font-size:12px;color:#888;}

/* SWITCH */
.switch{
  width:54px;height:30px;
  border-radius:15px;
  background:linear-gradient(90deg,#7b3fe4,#a855f7);
  position:relative;
  cursor:pointer;
  border:none;
}

.switch.off{
  background:#2a2a2a;
}

.switch-knob{
  position:absolute;
  top:3px;
  left:26px;
  width:24px;height:24px;
  background:white;
  border-radius:50%;
  transition:0.3s;
}

.switch.off .switch-knob{
  left:3px;
}

/* ACTIVATE BUTTON */
.activate-btn{
  width:100%;
  margin-top:20px;
  padding:16px;
  border:none;
  border-radius:20px;
  font-size:16px;
  font-weight:600;
  color:white;
  background:linear-gradient(90deg,#7b3fe4,#a855f7);
  box-shadow:0 0 20px rgba(168,85,247,0.6);
  opacity:0.5;
}

.activate-btn.enabled{
  opacity:1;
}

/* STATUS */
.status{
  text-align:center;
  margin-top:20px;
  font-size:12px;
  color:#888;
}
</style>
</head>

<body>

<!-- KEY -->
<div class="key-screen" id="keyScreen">
  <img src="logo.png" class="logo">
  <h2>Enter Key</h2>
  <input type="text" id="keyInput" class="key-input" placeholder="Enter key...">
  <button class="key-btn" onclick="checkKey()">Unlock</button>
</div>

<!-- PANEL -->
<div class="panel" id="panel">
  <div class="header">
    <div class="icon-box"></div>
    <h1>Auxilio</h1>
    <p class="subtitle">@HOKFFX</p>
  </div>

  <div class="controls">

    <div class="toggle-row">
      <div class="toggle-left">
        <div class="toggle-icon"></div>
        <div>
          <div class="toggle-label">Aimbot</div>
          <div class="toggle-sub">Auto-aim assist</div>
        </div>
      </div>
      <button class="switch" onclick="tog(this)">
        <div class="switch-knob"></div>
      </button>
    </div>

    <div class="toggle-row">
      <div class="toggle-left">
        <div class="toggle-icon"></div>
        <div>
          <div class="toggle-label">Maintain Headshot</div>
          <div class="toggle-sub">Lock to head</div>
        </div>
      </div>
      <button class="switch" onclick="tog(this)">
        <div class="switch-knob"></div>
      </button>
    </div>

    <div class="toggle-row">
      <div class="toggle-left">
        <div class="toggle-icon"></div>
        <div>
          <div class="toggle-label">120 FPS</div>
          <div class="toggle-sub">Max frame rate</div>
        </div>
      </div>
      <button class="switch" onclick="tog(this)">
        <div class="switch-knob"></div>
      </button>
    </div>

    <div class="toggle-row">
      <div class="toggle-left">
        <div class="toggle-icon"></div>
        <div>
          <div class="toggle-label">Anti Lag</div>
          <div class="toggle-sub">Network optimizer</div>
        </div>
      </div>
      <button class="switch" onclick="tog(this)">
        <div class="switch-knob"></div>
      </button>
    </div>

  </div>

  <!-- ACTIVATE BUTTON -->
  <button class="activate-btn" id="activateBtn" onclick="activateApp()">ACTIVATE</button>

  <div class="status">All systems active</div>
</div>

<script>
function checkKey(){
  let key=document.getElementById("keyInput").value;
  if(key==="Hokffx24266"){
    keyScreen.style.display="none";
    panel.style.display="block";
  } else {
    alert("Invalid Key");
  }
}

function tog(btn){
  btn.classList.toggle("off");
  checkAll();
}

function checkAll(){
  let switches=document.querySelectorAll(".switch");
  let allOn=true;

  switches.forEach(sw=>{
    if(sw.classList.contains("off")) allOn=false;
  });

  let btn=document.getElementById("activateBtn");

  if(allOn){
    btn.classList.add("enabled");
  }else{
    btn.classList.remove("enabled");
  }
}

function activateApp(){
  let btn=document.getElementById("activateBtn");

  if(!btn.classList.contains("enabled")){
    alert("Enable all features first");
    return;
  }

  // SAFE REDIRECT (change link)
  window.location.href="https://example.com";
}
</script>

</body>
</html>
