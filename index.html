<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auxilio - @Hokffx</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: hsl(260, 20%, 6%);
  color: hsl(270, 30%, 92%);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 16px;
}

/* KEY SCREEN */
.key-screen {
  width: 100%;
  max-width: 380px;
  text-align: center;
}

.logo {
  width: 90px;
  margin-bottom: 20px;
}

.key-input {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: none;
  margin-top: 10px;
  background: hsl(260, 25%, 10%);
  color: white;
}

.key-btn {
  width: 100%;
  margin-top: 14px;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: hsl(270, 80%, 60%);
  color: white;
  cursor: pointer;
}

/* PANEL */
.panel { display: none; width: 100%; max-width: 380px; }

.header { text-align: center; margin-bottom: 24px; }

.icon-box {
  width: 64px; height: 64px; margin: 0 auto 12px;
  background: hsl(270, 80%, 60%);
  border-radius: 16px; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 40px hsla(270, 80%, 60%, 0.4);
}

.icon-box svg { width: 32px; height: 32px; stroke: #fff; fill: none; stroke-width: 2; }

h1 { font-size: 24px; font-weight: 700; }

.subtitle { font-size: 11px; color: hsl(260, 15%, 55%); letter-spacing: 3px; text-transform: uppercase; }

.controls { display: flex; flex-direction: column; gap: 12px; }

.toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  background: hsl(260, 25%, 10%);
  border: 1px solid hsl(260, 25%, 18%);
  border-radius: 16px; padding: 16px 20px;
}

.toggle-left { display: flex; align-items: center; gap: 16px; }

.toggle-icon {
  width: 44px; height: 44px;
  background: hsl(260, 30%, 16%);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
}

.toggle-icon svg {
  width: 20px; height: 20px;
  stroke: hsl(270, 80%, 60%);
  fill: none; stroke-width: 2;
}

.toggle-label { font-size: 14px; font-weight: 600; }
.toggle-sub { font-size: 12px; color: hsl(260, 15%, 55%); }

.switch {
  width: 56px; height: 32px;
  border-radius: 16px;
  border: none;
  cursor: pointer;
  position: relative;
  background: hsl(270, 80%, 60%);
  box-shadow: 0 0 16px hsla(270, 80%, 60%, 0.5);
}

.switch.off {
  background: hsl(260, 20%, 14%);
  box-shadow: none;
}

.switch-knob {
  position: absolute;
  top: 4px;
  width: 24px;
  height: 24px;
  background: #fff;
  border-radius: 50%;
  left: 28px;
  transition: 0.3s;
}

.switch.off .switch-knob { left: 4px; }

.status {
  text-align: center;
  margin-top: 24px;
  font-size: 12px;
  color: hsl(260, 15%, 55%);
}
</style>
</head>

<body>

<!-- KEY SCREEN -->
<div class="key-screen" id="keyScreen">
  <img src="logo.png" class="logo">
  <h2>Enter Key</h2>

  <input type="text" id="keyInput" class="key-input" placeholder="Enter key...">
  <button class="key-btn" onclick="checkKey()">Unlock</button>
</div>

<!-- ORIGINAL PANEL -->
<div class="panel" id="panel">
  <div class="header">
    <div class="icon-box">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
    </div>
    <h1>Auxilio</h1>
    <p class="subtitle">@Hokffx</p>
  </div>

  <div class="controls">

    <div class="toggle-row">
      <div class="toggle-left">
        <div class="toggle-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
        </div>
        <div><div class="toggle-label">Aimbot</div><div class="toggle-sub">Auto-aim assist</div></div>
      </div>
      <button class="switch" onclick="tog(this)"><div class="switch-knob"></div></button>
    </div>

    <div class="toggle-row">
      <div class="toggle-left">
        <div class="toggle-icon">
          <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14"/></svg>
        </div>
        <div><div class="toggle-label">Maintain Headshot</div><div class="toggle-sub">Lock to head</div></div>
      </div>
      <button class="switch" onclick="tog(this)"><div class="switch-knob"></div></button>
    </div>

    <div class="toggle-row">
      <div class="toggle-left">
        <div class="toggle-icon">
          <svg viewBox="0 0 24 24"><path d="M12 6v6l4 2"/></svg>
        </div>
        <div><div class="toggle-label">120 FPS</div><div class="toggle-sub">Max frame rate</div></div>
      </div>
      <button class="switch" onclick="tog(this)"><div class="switch-knob"></div></button>
    </div>

    <div class="toggle-row">
      <div class="toggle-left">
        <div class="toggle-icon">
          <svg viewBox="0 0 24 24"><path d="M5 12a10 10 0 0 1 14 0"/></svg>
        </div>
        <div><div class="toggle-label">Anti Lag</div><div class="toggle-sub">Network optimizer</div></div>
      </div>
      <button class="switch" onclick="tog(this)"><div class="switch-knob"></div></button>
    </div>

  </div>

  <div class="status">All systems active</div>
</div>

<script>
function checkKey() {
  let key = document.getElementById("keyInput").value;

  if (key === "Hokffx24266") {
    document.getElementById("keyScreen").style.display = "none";
    document.getElementById("panel").style.display = "block";
  } else {
    alert("Invalid Key");
  }
}

function tog(btn) {
  btn.classList.toggle('off');
}
</script>

</body>
</html>
