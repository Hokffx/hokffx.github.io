<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auxilio - @Hokffx</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: hsl(260, 20%, 6%);
  color: hsl(270, 30%, 92%);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* KEY SCREEN */
.key-screen {
  text-align: center;
  width: 100%;
  max-width: 380px;
}

.logo {
  width: 80px;
  margin-bottom: 20px;
}

.key-box {
  background: hsl(260, 25%, 10%);
  padding: 20px;
  border-radius: 16px;
  border: 1px solid hsl(260, 25%, 18%);
}

.key-input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
  margin-bottom: 12px;
  background: hsl(260, 20%, 14%);
  color: white;
  text-align: center;
}

.key-btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: hsl(270, 80%, 60%);
  color: white;
  cursor: pointer;
  font-weight: 600;
}

/* PANEL */
.panel { display: none; width: 100%; max-width: 380px; }

.header { text-align: center; margin-bottom: 24px; }

.icon-box {
  width: 64px;
  height: 64px;
  margin: 0 auto 12px;
  background: hsl(270, 80%, 60%);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}

h1 { font-size: 24px; }

.subtitle {
  font-size: 11px;
  color: hsl(260, 15%, 55%);
  letter-spacing: 3px;
}

.controls { display: flex; flex-direction: column; gap: 12px; }

.toggle-row {
  display: flex;
  justify-content: space-between;
  background: hsl(260, 25%, 10%);
  padding: 16px;
  border-radius: 16px;
}

.toggle-left { display: flex; gap: 12px; align-items: center; }

.switch {
  width: 56px;
  height: 32px;
  border-radius: 16px;
  border: none;
  cursor: pointer;
  position: relative;
  background: hsl(270, 80%, 60%);
}

.switch.off { background: hsl(260, 20%, 14%); }

.switch-knob {
  position: absolute;
  top: 4px;
  left: 28px;
  width: 24px;
  height: 24px;
  background: white;
  border-radius: 50%;
  transition: 0.3s;
}

.switch.off .switch-knob { left: 4px; }

.status {
  text-align: center;
  margin-top: 20px;
  font-size: 12px;
}
</style>
</head>

<body>

<!-- KEY SYSTEM -->
<div class="key-screen" id="keyScreen">
  <!-- LOGO -->
  <img src="logo.png" class="logo">

  <div class="key-box">
    <input type="text" id="keyInput" class="key-input" placeholder="Enter Key">
    <button class="key-btn" onclick="checkKey()">Unlock</button>
  </div>
</div>

<!-- MAIN PANEL -->
<div class="panel" id="panel">
  <div class="header">
    <div class="icon-box"></div>
    <h1>Auxilio</h1>
    <p class="subtitle">@Hokffx</p>
  </div>

  <div class="controls">

    <div class="toggle-row">
      <div class="toggle-left">Aimbot</div>
      <button class="switch" onclick="tog(this)">
        <div class="switch-knob"></div>
      </button>
    </div>

    <div class="toggle-row">
      <div class="toggle-left">Headshot Lock</div>
      <button class="switch" onclick="tog(this)">
        <div class="switch-knob"></div>
      </button>
    </div>

    <div class="toggle-row">
      <div class="toggle-left">120 FPS</div>
      <button class="switch" onclick="tog(this)">
        <div class="switch-knob"></div>
      </button>
    </div>

    <div class="toggle-row">
      <div class="toggle-left">Anti Lag</div>
      <button class="switch" onclick="tog(this)">
        <div class="switch-knob"></div>
      </button>
    </div>

  </div>

  <div class="status">All systems active</div>
</div>

<script>
function checkKey() {
  const key = document.getElementById("keyInput").value;

  if (key === "Hokffx24266") {
    document.getElementById("keyScreen").style.display = "none";
    document.getElementById("panel").style.display = "block";
  } else {
    alert("Invalid Key");
  }
}

function tog(btn) {
  btn.classList.toggle("off");
}
</script>

</body>
</html>
