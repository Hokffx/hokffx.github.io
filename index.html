<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auxilio - @Hokffx</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:hsl(260,20%,6%);
  color:hsl(270,30%,92%);
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;padding:16px;
}

/* KEY SCREEN */
.key-screen{
  width:100%;
  max-width:380px;
  text-align:center;
}
.logo{
  width:70px;
  margin-bottom:16px;
}
.key-input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  background:hsl(260,25%,12%);
  color:white;
}
.key-btn{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:none;
  border-radius:14px;
  background:hsl(270,80%,60%);
  color:white;
}

/* PANEL */
.panel{display:none;width:100%;max-width:380px;}

.header{text-align:center;margin-bottom:24px;}

.icon-box{
  width:64px;height:64px;margin:0 auto 12px;
  background:hsl(270,80%,60%);
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 40px hsla(270,80%,60%,0.4);
}

.icon-box svg{
  width:32px;height:32px;
  stroke:#fff;
  fill:none;
  stroke-width:2;
}

h1{font-size:24px;font-weight:700;}
.subtitle{
  font-size:11px;
  color:hsl(260,15%,55%);
  letter-spacing:3px;
  text-transform:uppercase;
}

.controls{display:flex;flex-direction:column;gap:12px;}

.toggle-row{
  display:flex;align-items:center;justify-content:space-between;
  background:hsl(260,25%,10%);
  border:1px solid hsl(260,25%,18%);
  border-radius:16px;
  padding:16px 20px;
}

.toggle-left{display:flex;align-items:center;gap:16px;}

.toggle-icon{
  width:44px;height:44px;
  background:hsl(260,30%,16%);
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
}

.toggle-icon svg{
  width:20px;height:20px;
  stroke:hsl(270,80%,60%);
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.toggle-label{font-size:14px;font-weight:600;}
.toggle-sub{font-size:12px;color:hsl(260,15%,55%);}

/* SWITCH */
.switch{
  width:56px;height:32px;
  border-radius:16px;
  border:none;
  cursor:pointer;
  position:relative;
  background:hsl(260,20%,14%);
}

.switch-knob{
  position:absolute;
  top:4px;
  left:4px;
  width:24px;height:24px;
  background:#fff;
  border-radius:50%;
  transition:0.3s;
}

.switch.active{
  background:hsl(270,80%,60%);
  box-shadow:0 0 16px hsla(270,80%,60%,0.5);
}

.switch.active .switch-knob{
  left:28px;
}

/* ACTIVATE BUTTON */
.activate-btn{
  width:100%;
  margin-top:20px;
  padding:16px;
  border:none;
  border-radius:16px;
  background:hsl(270,80%,60%);
  color:white;
  font-weight:600;
  font-size:16px;
  box-shadow:0 0 20px hsla(270,80%,60%,0.5);
}

/* STATUS */
.status{
  text-align:center;
  margin-top:16px;
  font-size:12px;
  color:hsl(260,15%,55%);
}

/* LOADING SCREEN */
.loading-screen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:hsl(260,20%,6%);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:999;
}

.loader{
  width:60px;
  height:60px;
  border-radius:50%;
  border:4px solid rgba(168,85,247,0.2);
  border-top:4px solid #a855f7;
  animation:spin 1s linear infinite;
  margin-bottom:20px;
}

@keyframes spin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}
</style>
</head>

<body>

<!-- KEY SCREEN -->
<div class="key-screen" id="keyScreen">
  <img src="logo.png" class="logo">
  <h2>Enter Key</h2>
  <input id="keyInput" class="key-input" placeholder="Enter key...">
  <button class="key-btn" onclick="checkKey()">Unlock</button>
</div>

<!-- PANEL -->
<div class="panel" id="panel">

  <div class="header">
    <div class="icon-box">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <line x1="22" y1="12" x2="18" y2="12"/>
        <line x1="6" y1="12" x2="2" y2="12"/>
        <line x1="12" y1="6" x2="12" y2="2"/>
        <line x1="12" y1="22" x2="12" y2="18"/>
      </svg>
    </div>
    <h1>Auxilio</h1>
    <p class="subtitle">@HOKFFX</p>
  </div>

  <div class="controls">

    <!-- Aimbot -->
    <div class="toggle-row">
      <div class="toggle-left">
        <div class="toggle-icon">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <line x1="22" y1="12" x2="18" y2="12"/>
            <line x1="6" y1="12" x2="2" y2="12"/>
            <line x1="12" y1="6" x2="12" y2="2"/>
            <line x1="12" y1="22" x2="12" y2="18"/>
          </svg>
        </div>
        <div>
          <div class="toggle-label">Aimbot</div>
          <div class="toggle-sub">Auto-aim assist</div>
        </div>
      </div>
      <button class="switch" onclick="tog(this)">
        <div class="switch-knob"></div>
      </button>
    </div>

    <!-- Headshot -->
    <div class="toggle-row">
      <div class="toggle-left">
        <div class="toggle-icon">
          <svg viewBox="0 0 24 24">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </div>
        <div>
          <div class="toggle-label">Maintain Headshot</div>
          <div class="toggle-sub">Lock to head</div>
        </div>
      </div>
      <button class="switch" onclick="tog(this)">
        <div class="switch-knob"></div>
      </button>
    </div>

    <!-- FPS -->
    <div class="toggle-row">
      <div class="toggle-left">
        <div class="toggle-icon">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
        </div>
        <div>
          <div class="toggle-label">120 FPS</div>
          <div class="toggle-sub">Max frame rate</div>
        </div>
      </div>
      <button class="switch" onclick="tog(this)">
        <div class="switch-knob"></div>
      </button>
    </div>

    <!-- Anti Lag -->
    <div class="toggle-row">
      <div class="toggle-left">
        <div class="toggle-icon">
          <svg viewBox="0 0 24 24">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
            <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <circle cx="12" cy="20" r="1"/>
          </svg>
        </div>
        <div>
          <div class="toggle-label">Anti Lag</div>
          <div class="toggle-sub">Network optimizer</div>
        </div>
      </div>
      <button class="switch" onclick="tog(this)">
        <div class="switch-knob"></div>
      </button>
    </div>

  </div>

  <button id="activateBtn" class="activate-btn" onclick="activateApp()">ACTIVATE</button>

  <div class="status">All systems inactive</div>
</div>

<!-- LOADING -->
<div class="loading-screen" id="loadingScreen">
  <div class="loader"></div>
  <h2>Optimizing...</h2>
  <p id="loadingText">Initializing</p>
</div>

<script>
function checkKey(){
  if(document.getElementById("keyInput").value==="Hokffx24266"){
    keyScreen.style.display="none";
    panel.style.display="block";
  }else{
    alert("Invalid Key");
  }
}

function tog(btn){
  btn.classList.toggle("active");
}

function activateApp(){
  let switches=document.querySelectorAll(".switch");
  let allOn=true;

  switches.forEach(sw=>{
    if(!sw.classList.contains("active")) allOn=false;
  });

  if(!allOn){
    alert("Enable all features first");
    return;
  }

  document.getElementById("loadingScreen").style.display="flex";

  let steps=[
    "Initializing modules",
    "Optimizing aim system",
    "Boosting FPS",
    "Stabilizing network",
    "Finalizing..."
  ];

  let i=0;

  let interval=setInterval(()=>{
    document.getElementById("loadingText").innerText=steps[i];
    i++;

    if(i>=steps.length){
      clearInterval(interval);
      document.getElementById("loadingText").innerText="Activated Successfully";
    }

  },1200);
}
</script>

</body>
</html>
