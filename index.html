<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auxilio</title><style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#07060d;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* LOGIN */
.login-box{
  width:90%;
  max-width:350px;
  text-align:center;
}

/* PROFILE IMAGE */
.login-profile{
  width:100px;
  height:100px;
  border-radius:50%;
  overflow:hidden;
  margin:0 auto 15px;
}

.login-profile img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* TEXT */
h2{
  font-size:28px;
  margin-bottom:20px;
}

/* INPUT */
input{
  width:100%;
  padding:16px;
  border:none;
  border-radius:20px;
  background:#1a1725;
  color:#fff;
  margin-bottom:15px;
}

/* BUTTON */
button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:20px;
  background:linear-gradient(90deg,#7c3aed,#9333ea);
  color:#fff;
  font-size:16px;
}

/* ERROR */
.error{
  color:#ff4d4d;
  font-size:13px;
  margin-top:10px;
  display:none;
}
</style></head><body><div class="login-box">  <!-- PROFILE IMAGE -->  <div class="login-profile">
    <img src="profile.png">
    <!-- OR use this if using Drive -->
    <!-- <img src="https://drive.google.com/uc?export=view&id=18yZzCy1b_NqRhszfhRYfR6VyiuWBAQDO"> -->
  </div>  <h2>Enter Key</h2>  <input type="password" id="key" placeholder="Enter key...">
  <button onclick="checkKey()">Unlock</button>  <div class="error" id="error">❌ Wrong password</div></div><script>
function checkKey(){
  let key=document.getElementById("key").value;

  if(key==="Hokffx24266"){
    alert("Access Granted ✅");
  }else{
    document.getElementById("error").style.display="block";
  }
}
</script></body>
</html>
